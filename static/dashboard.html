<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Cost Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2; --surface-1: #fcfcfb; --border: #e2e1dc;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #77766f;
    --grid: #ebeae6;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --good: #0f7b3d; --bad: #c0362c;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2c;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a998f;
      --grid: #2a2a28;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --good: #4cc27c; --bad: #ef7a70;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2c;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a998f;
    --grid: #2a2a28;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good: #4cc27c; --bad: #ef7a70;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--text-primary);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .sub { color: var(--text-secondary); margin: 4px 0 0; }
  select, input, button { font: inherit; color: var(--text-primary); background: var(--surface-1);
         border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  button { cursor: pointer; font-weight: 600; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile .label { color: var(--text-secondary); font-size: 12px; }
  .tile .value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .delta { font-size: 12px; color: var(--text-muted); min-height: 18px; }
  .delta.good { color: var(--good); } .delta.bad { color: var(--bad); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
  .chart-box { position: relative; height: 280px; }
  .ask { display: flex; gap: 8px; flex-wrap: wrap; }
  .ask input { flex: 1 1 280px; }
  .answer { margin-top: 12px; white-space: pre-wrap; color: var(--text-primary); }
  .meta { color: var(--text-secondary); font-size: 12px; margin-top: 6px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-secondary); font-weight: 600; }
  td.q { white-space: normal; min-width: 260px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .empty { color: var(--text-muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>RAG cost &amp; latency dashboard</h1>
      <p class="sub">Semantic cache + model routing. Every request is logged with its cost, latency and route.</p>
    </div>
    <label>Run&nbsp;<select id="run"></select></label>
  </header>

  <section class="tiles" id="tiles"></section>

  <section class="grid2">
    <div class="card">
      <h2>Latency per request (log scale)</h2>
      <div class="chart-box"><canvas id="latency" aria-label="Latency per request, colored by route"></canvas></div>
    </div>
    <div class="card">
      <h2>Cumulative LLM cost by run</h2>
      <div class="chart-box"><canvas id="cost" aria-label="Cumulative cost per run"></canvas></div>
    </div>
  </section>

  <section class="card" style="margin-bottom:16px">
    <h2>Ask a question (logged as run "live")</h2>
    <form class="ask" id="askForm">
      <input id="question" placeholder="e.g. How much does the Plus plan cost?" autocomplete="off">
      <button type="submit">Ask</button>
    </form>
    <div id="answer"></div>
  </section>

  <section class="card">
    <h2>Recent requests (latest 25)</h2>
    <div class="table-wrap" id="table"></div>
  </section>
</main>

<script>
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const TIERS = { cache: { label: "Cache hit", color: "--s3" },
                small: { label: "Small model", color: "--s1" },
                large: { label: "Large model", color: "--s2" } };
const RUN_ORDER = ["baseline", "optimized", "live"];          // fixed color per run
const runColor = (run) => ["--s1", "--s2", "--s3"][Math.max(0, RUN_ORDER.indexOf(run)) % 3];
const $ = (id) => document.getElementById(id);
const money = (x, d = 4) => "$" + Number(x).toFixed(d);
const ms = (x) => x >= 1000 ? (x / 1000).toFixed(2) + " s" : Math.round(x) + " ms";
let charts = {};

async function getJSON(url, opts) { const r = await fetch(url, opts); return r.json(); }

async function loadRuns() {
  const runs = await getJSON("/api/runs");
  const sel = $("run"), prev = sel.value;
  sel.innerHTML = runs.length ? "" : "<option value=''>no data yet</option>";
  const ordered = [...runs].sort((a, b) => (RUN_ORDER.indexOf(a) + 9) % 9 - (RUN_ORDER.indexOf(b) + 9) % 9);
  for (const r of ordered) sel.add(new Option(r, r));
  sel.value = runs.includes(prev) ? prev : (runs.includes("optimized") ? "optimized" : runs[0] || "");
  return runs;
}

function tile(label, value, delta, goodWhenLower = true) {
  let cls = "", txt = "";
  if (delta !== null && isFinite(delta)) {
    const better = goodWhenLower ? delta < 0 : delta > 0;
    cls = Math.abs(delta) < 0.5 ? "" : (better ? "good" : "bad");
    txt = (delta > 0 ? "+" : "") + delta.toFixed(0) + (goodWhenLower ? "% vs baseline" : " pts vs baseline");
  }
  return `<div class="card tile"><div class="label">${label}</div><div class="value">${value}</div><div class="delta ${cls}">${txt}</div></div>`;
}

async function renderTiles(run, runs) {
  const s = await getJSON("/api/summary?run=" + encodeURIComponent(run));
  if (!s.requests) { $("tiles").innerHTML = `<div class="card empty">No requests yet. Run <code>python benchmark.py</code> or ask a question below.</div>`; return; }
  const b = run !== "baseline" && runs.includes("baseline") ? await getJSON("/api/summary?run=baseline") : null;
  const pct = (k) => b && b[k] ? (s[k] / b[k] - 1) * 100 : null;
  $("tiles").innerHTML = [
    tile("Requests", s.requests, null),
    tile("Cache hit rate", (s.cache_hit_rate * 100).toFixed(0) + "%", b ? (s.cache_hit_rate - b.cache_hit_rate) * 100 : null, false),
    tile("Total LLM cost", money(s.total_cost_usd), pct("total_cost_usd")),
    tile("Cost / 1k requests", money(s.cost_per_1k_requests_usd, 2), pct("cost_per_1k_requests_usd")),
    tile("p50 latency", ms(s.p50_latency_ms), pct("p50_latency_ms")),
    tile("p95 latency", ms(s.p95_latency_ms), pct("p95_latency_ms")),
  ].join("");
}

function baseOptions(yTitle, logY) {
  const text = css("--text-secondary"), grid = css("--grid");
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "nearest", intersect: false },
    plugins: { legend: { labels: { color: text, usePointStyle: true, boxWidth: 8 } },
               tooltip: { padding: 10 } },
    scales: {
      x: { type: "linear", title: { display: true, text: "Request #", color: text }, ticks: { color: text }, grid: { color: grid } },
      y: { type: logY ? "logarithmic" : "linear", title: { display: true, text: yTitle, color: text },
           ticks: { color: text }, grid: { color: grid } },
    },
  };
}

function renderLatency(rows) {
  const datasets = Object.entries(TIERS).map(([tier, t]) => ({
    label: t.label,
    data: rows.map((r, i) => ({ x: i + 1, y: Math.max(r.latency_ms, 1), r })).filter((p) => p.r.tier === tier),
    backgroundColor: css(t.color), borderColor: css("--surface-1"), borderWidth: 2,
    pointRadius: 5, pointHoverRadius: 7,
  }));
  const opts = baseOptions("Latency (ms)", true);
  opts.plugins.tooltip.callbacks = {
    label: (c) => { const r = c.raw.r; return [`${TIERS[r.tier].label} · ${ms(r.latency_ms)} · ${money(r.cost_usd, 5)}`, r.query.slice(0, 70)]; },
  };
  charts.latency?.destroy();
  charts.latency = new Chart($("latency"), { type: "scatter", data: { datasets }, options: opts });
}

async function renderCost(runs) {
  const datasets = [];
  for (const run of RUN_ORDER.filter((r) => runs.includes(r)).concat(runs.filter((r) => !RUN_ORDER.includes(r)))) {
    const rows = await getJSON("/api/requests?limit=5000&run=" + encodeURIComponent(run));
    let total = 0;
    datasets.push({
      label: run, data: rows.map((r, i) => ({ x: i + 1, y: (total += r.cost_usd) })),
      borderColor: css(runColor(run)), backgroundColor: css(runColor(run)),
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0,
    });
  }
  const opts = baseOptions("Cumulative cost (USD)", false);
  opts.plugins.tooltip.callbacks = { label: (c) => `${c.dataset.label}: ${money(c.raw.y)} after ${c.raw.x} requests` };
  opts.interaction = { mode: "index", intersect: false };
  charts.cost?.destroy();
  charts.cost = new Chart($("cost"), { type: "line", data: { datasets }, options: opts });
}

function renderTable(rows) {
  if (!rows.length) { $("table").innerHTML = `<div class="empty">No requests in this run.</div>`; return; }
  const body = rows.slice(-25).reverse().map((r) => `<tr>
      <td><span class="pill"><span class="dot" style="background:${css(TIERS[r.tier].color)}"></span>${TIERS[r.tier].label}</span></td>
      <td class="q">${escapeHtml(r.query)}</td>
      <td>${r.model || ""}</td>
      <td class="num">${ms(r.latency_ms)}</td>
      <td class="num">${money(r.cost_usd, 5)}</td>
      <td class="num">${r.similarity ? r.similarity.toFixed(3) : "-"}</td>
      <td class="q">${escapeHtml(r.route_reason || "")}</td></tr>`).join("");
  $("table").innerHTML = `<table><thead><tr><th>Route</th><th>Question</th><th>Model</th><th>Latency</th><th>Cost</th><th>Cache sim.</th><th>Why</th></tr></thead><tbody>${body}</tbody></table>`;
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

async function refresh() {
  const runs = await loadRuns();
  const run = $("run").value;
  if (!run) { await renderTiles("", runs); renderTable([]); return; }
  const rows = await getJSON("/api/requests?limit=5000&run=" + encodeURIComponent(run));
  await renderTiles(run, runs);
  renderLatency(rows);
  await renderCost(runs);
  renderTable(rows);
}

$("run").addEventListener("change", refresh);
$("askForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("question").value.trim();
  if (!q) return;
  $("answer").innerHTML = `<div class="meta">Thinking…</div>`;
  try {
    const a = await getJSON("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }) });
    $("answer").innerHTML = `<div class="answer">${escapeHtml(a.answer)}</div>
      <div class="meta">${TIERS[a.tier].label} · ${a.model} · ${ms(a.latency_ms)} · ${money(a.cost_usd, 5)} · ${escapeHtml(a.route_reason)}</div>`;
    $("run").value = "live";
    await refresh();
  } catch (err) {
    $("answer").innerHTML = `<div class="meta">Request failed: ${escapeHtml(String(err))}. Check the server terminal.</div>`;
  }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refresh);
refresh();
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 10000);
</script>
</body>
</html>
